[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "activefrontier"
version = "0.1.0"
description = "Cellular automata library that simulates species dispersal and biotic interactions on active colonization frontiers."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    "rasterio",
    "geopandas",
    "shapely",
    "scipy",
    "numba",
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/PatronRiveroC/activeFrontier"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
activefrontier = ["data/*", "vignette/*"]